# Space Charge Effect Configuration
# =================================

# ============================================
# DETECTOR-SPECIFIC PARAMETERS (change per experiment)
# ============================================

# Nominal drift electric field magnitude (V/cm)
E0: 500.0

# Volumetric charge production rate from cosmic rays (C/m^3/s)
# Default: ~2e-10 at 500 V/cm for surface-level Fermilab detectors
# Set to ~0 for deep underground detectors (e.g., DUNE far detector)
Q_charge_production: 2.0e-10

# ============================================
# LIQUID ARGON PROPERTIES (universal constants)
# ============================================

# Relative permittivity of liquid argon
epsilon_r: 1.505

# Positive ion mobility in LAr (cm^2/V/s)
# Literature range: 0.8e-4 to 1.6e-3 cm^2/V/s
# Standard value used by MicroBooNE: 8e-4
mu_ion: 8.0e-4

# LAr temperature (K)
temperature: 89.0

# ============================================
# GRID PARAMETERS
# ============================================

# Number of grid points for Poisson solve
Nx_poisson: 101
Ny_poisson: 101
Nz_poisson: 101

# Number of grid points for distortion map output
# (can be coarser than Poisson grid to speed up electron tracing)
Nx_output: 26
Ny_output: 26
Nz_output: 26

# ============================================
# SOLVER PARAMETERS
# ============================================

# Electron tracing method: 'RK45' or 'euler'
tracing_method: "RK45"

# Relative tolerance for ODE solver
tracing_rtol: 1.0e-6

# Absolute tolerance for ODE solver
tracing_atol: 1.0e-6

# Maximum integration time (us) -- safety cutoff
tracing_t_max: 20000.0

# Number of parallel workers for electron tracing (null = use all cores)
n_workers: null

# ============================================
# SELF-CONSISTENT ITERATION
# ============================================
# When enabled, iteratively recomputes v_ion(x) from the E-field
# to account for spatial variation of ion drift speed.

# Enable self-consistent v_ion iteration
self_consistent: false

# Maximum number of iterations
sc_max_iter: 10

# Convergence tolerance (relative change in rho)
sc_tol: 1.0e-3

# Under-relaxation factor (0 < alpha <= 1)
sc_alpha: 0.5
