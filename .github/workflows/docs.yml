name: docs

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege token scoped for the Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Serialize deployments; don't cancel an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      # Only the docs toolchain is needed: mkdocstrings uses griffe's STATIC
      # analysis (no import), so the runtime deps (jax, etc.) are not required
      # to build the API reference.
      - name: Install docs dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs-material "mkdocstrings[python]" mkdocs-jupyter

      # --strict fails the build on any broken link or mkdocstrings warning,
      # so this also gates pull requests.
      - name: Build site (strict)
        run: mkdocs build --strict

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    # Publish only from main; PRs just build as a gate.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
