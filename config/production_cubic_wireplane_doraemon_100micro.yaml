# JAXTPC production config — generated by profiler
#
# UNITS: wire hits are in ENC (electrons) by design — wire response is applied
# pre-electronics, so the kernel is dimensionless and intensity (e-) × kernel
# → ENC. The sensor signal becomes ADC only after the electronics → noise →
# digitize chain. So:
#   - inter_thresh and corr_threshold are in ENC (filter hits charge in e-)
#   - threshold_adc is in ADC (filters the post-digitize sensor signal)
# Contrast with pixel (config/production_cubic_pixel_doraemon.yaml), where
# both hits and signal are in ADC. See CLAUDE.md "Units convention".
