total_pad: 1330000
response_chunk: 33250
hits_chunk: 133000
max_keys: 7000000
maxg: 240000              # box track-hits group capacity; p99.95 over 100k events (233,108), 0.034% overflow -> reprocess
maxg_medium: 180000       # tiered mode: p99 of n_groups; 99% of events route here (smaller box, ~24% faster)
inter_thresh: 1.0         # ENC (wire): in-JIT box compaction filter, |sig| > 1.0 e-
threshold_adc: 2.0        # ADC (wire sensor sparse output, post-digitize)
corr_threshold: 25.0      # ENC (wire hits CSR encode), chs > 25 e- (signed, wire is positive)
