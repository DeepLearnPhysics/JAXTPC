[pytest]
# Put the repo root on sys.path so `import tools` (and production/, profiler/)
# resolves under ANY pytest invocation. Bare `pytest` does not add the cwd to
# sys.path; only `python -m pytest` does. Setting pythonpath here makes local
# and CI runs behave identically without requiring a packaging/install step.
pythonpath = .
testpaths = tests
