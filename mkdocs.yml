site_name: JAXTPC
site_description: GPU-accelerated, differentiable liquid-argon TPC detector simulation in JAX
repo_url: https://github.com/DeepLearnPhysics/JAXTPC
repo_name: DeepLearnPhysics/JAXTPC
docs_dir: docs

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.instant
    - content.code.copy
    - search.suggest
  palette:
    - scheme: default
      primary: indigo
      toggle: { icon: material/weather-night, name: Dark mode }
    - scheme: slate
      primary: indigo
      toggle: { icon: material/weather-sunny, name: Light mode }

# Build with the docs extra:  pip install -e ".[docs]" && mkdocs serve
plugins:
  - search
  - mkdocstrings:        # auto API reference from docstrings (reference/api/*)
      handlers:
        python:
          paths: ["."]
          options:
            docstring_style: numpy
            show_source: true
            show_root_heading: true
            members_order: source
  - mkdocs-jupyter:      # render the synthetic tutorial notebooks (docs/tutorials/)
      include_source: true
      execute: true      # execute-at-build: plots live only in the built site,
                         # never committed (source notebooks stay stripped)
      allow_errors: false
      theme: light

markdown_extensions:
  - admonition
  - tables
  - toc: { permalink: true }
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

